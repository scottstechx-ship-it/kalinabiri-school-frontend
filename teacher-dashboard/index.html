                }

                // ===== COMMUNICATION CENTER =====
                let commCenter = null;
                async function renderCommunication(container) {
                    container.innerHTML = `
                        <div class="communication-center" style="height: calc(100vh - 120px); display: flex; flex-direction: column;">
                            <div class="comm-header" style="padding: 16px 24px; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center;">
                                <h2 class="card-title" style="margin: 0;">Communication Center</h2>
                                <div style="display: flex; gap: 12px;">
                                    <button class="btn btn-primary" onclick="openNewConversation()">+ New Message</button>
                                    <button class="btn btn-secondary" onclick="refreshConversations()"><svg width="16" height="16" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"/></svg></button>
                                </div>
                            </div>
                            <div class="comm-body" style="flex: 1; display: flex; overflow: hidden;">
                                <!-- Conversation List -->
                                <div class="comm-sidebar" style="width: 380px; border-right: 1px solid var(--border); display: flex; flex-direction: column; overflow: hidden;">
                                    <div class="comm-search" style="padding: 16px; border-bottom: 1px solid var(--border);">
                                        <input type="text" id="commSearch" placeholder="Search conversations..." style="width: 100%; padding: 10px 14px; background: var(--primary); border: 1px solid var(--border); border-radius: 8px; color: var(--text); font-size: 14px;">
                                    </div>
                                    <div class="comm-conversations" id="commConversations" style="flex: 1; overflow-y: auto;">
                                        <div class="loading-overlay"><div class="spinner"></div></div>
                                    </div>
                                </div>
                                <!-- Chat Area -->
                                <div class="comm-chat" style="flex: 1; display: flex; flex-direction: column; background: var(--bg);">
                                    <div class="comm-chat-header" id="commChatHeader" style="padding: 16px 24px; border-bottom: 1px solid var(--border); background: var(--bg-card);">
                                        <div class="comm-chat-title" style="display: flex; align-items: center; gap: 12px;">
                                            <div class="user-avatar" style="width: 40px; height: 40px;">💬</div>
                                            <div>
                                                <div style="font-weight: 600;">Select a conversation</div>
                                                <div style="font-size: 12px; color: var(--text-muted);">Start messaging</div>
                                            </div>
                                        </div>
                                        <div class="comm-chat-actions" style="display: flex; gap: 8px;">
                                            <button class="btn btn-sm btn-secondary" onclick="openConversationInfo()">Info</button>
                                        </div>
                                    </div>
                                    <div class="comm-messages" id="commMessages" style="flex: 1; overflow-y: auto; padding: 24px; display: flex; flex-direction: column; gap: 16px;">
                                        <div class="comm-empty" style="flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; color: var(--text-muted); text-align: center;">
                                            <svg width="64" height="64" fill="none" stroke="currentColor" viewBox="0 0 24 24" style="margin-bottom: 16px; opacity: 0.5;"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 12h.01M12 12h.01M16 12h.01M21 12c0 4.418-4.03 8-9 8a9.863 9.863 0 01-4.255-.949L3 20l1.395-3.72C3.512 15.042 3 13.574 3 12c0-4.418 4.03-8 9-8s9 3.582 9 8z"/></svg>
                                            <p style="font-size: 16px;">Select a conversation to start messaging</p>
                                        </div>
                                    </div>
                                    <div class="comm-input-area" id="commInputArea" style="padding: 16px 24px; border-top: 1px solid var(--border); background: var(--bg-card); display: none;">
                                        <div style="display: flex; gap: 12px; align-items: flex-end;">
                                            <div style="flex: 1; position: relative;">
                                                <textarea id="commMessageInput" placeholder="Type a message..." rows="1" style="width: 100%; padding: 12px 16px; background: var(--primary); border: 1px solid var(--border); border-radius: 24px; color: var(--text); font-size: 14px; resize: none; font-family: inherit; min-height: 44px; max-height: 150px;"></textarea>
                                            </div>
                                            <button class="btn btn-primary" onclick="sendMessage()" style="width: 44px; height: 44px; border-radius: 50%; padding: 0; display: flex; align-items: center; justify-content: center;">
                                                <svg width="20" height="20" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 19l9 2-9-18-9 18 9-2zm0 0v-8"/></svg>
                                            </button>
                                        </div>
                                        <div class="comm-typing" id="commTyping" style="margin-top: 8px; font-size: 12px; color: var(--text-muted); min-height: 16px;"></div>
                                    </div>
                                </div>
                            </div>
                        </div>`;

                    // Initialize Communication Center
                    if (!commCenter) {
                        commCenter = new CommunicationCenter({
                            apiBase: KalinabiriAPI.API_BASE,
                            currentUser: teacherData,
                            onConversationChange: (conversations) => renderConversationList(conversations),
                            onMessage: (message) => handleNewMessage(message),
                            onNotification: (notifications) => { /* handled by existing notification system */ },
                            onPresenceChange: (presence) => updatePresenceIndicators(presence),
                            onTyping: (typingUsers) => updateTypingIndicator(typingUsers),
                            onError: (err) => console.error('Comm error:', err)
                        });
                    }
            
                    // Initialize socket connection
                    const { io } = await import('/socket.io/socket.io.esm.min.js').catch(() => ({ io: null }));
                    if (io) {
                        const socket = io(KalinabiriAPI.API_BASE.replace('/api', ''), {
                            auth: { token: KalinabiriAPI.getToken() },
                            transports: ['websocket', 'polling']
                        });
                        await commCenter.init(socket, teacherData);
                    } else {
                        // Fallback: poll for messages
                        setInterval(() => commCenter.loadConversations(), 10000);
                        await commCenter.loadConversations();
                    }
            
                    // Setup event listeners
                    setupCommunicationEvents();
                }

                function setupCommunicationEvents() {
                    // Search
                    $('#commSearch')?.addEventListener('input', (e) => {
                        filterConversations(e.target.value);
                    });
            
                    // Message input
                    const msgInput = $('#commMessageInput');
                    if (msgInput) {
                        msgInput.addEventListener('keydown', (e) => {
                            if (e.key === 'Enter' && !e.shiftKey) {
                                e.preventDefault();
                                sendMessage();
                            }
                        });
                
                        // Typing indicator
                        let typingTimeout;
                        msgInput.addEventListener('input', () => {
                            if (commCenter && commCenter.activeConversation) {
                                commCenter.sendTyping(commCenter.activeConversation.id, true);
                                clearTimeout(typingTimeout);
                                typingTimeout = setTimeout(() => {
                                    commCenter.sendTyping(commCenter.activeConversation.id, false);
                                }, 1000);
                            }
                        });
                    }
                }

                async function refreshConversations() {
                    if (commCenter) {
                        await commCenter.loadConversations();
                    }
                }

                function renderConversationList(conversations) {
                    const container = $('#commConversations');
                    if (!container) return;
            
                    if (conversations.length === 0) {
                        container.innerHTML = '<div style="padding: 24px; text-align: center; color: var(--text-muted);">No conversations yet. Click "+ New Message" to start.</div>';
                        return;
                    }
            
                    container.innerHTML = conversations.map(conv => {
                        const isActive = commCenter?.activeConversation?.id === conv.id;
                        const lastMsg = conv.messages?.[0] || {};
                        const unread = conv.unread_count || 0;
                        const otherMember = conv.members?.find(m => m.id !== teacherData.id);
                        const name = conv.type === 'direct' && otherMember 
                            ? (otherMember.name || otherMember.first_name + ' ' + otherMember.last_name)
                            : conv.name || 'Group Chat';
                        const avatar = conv.type === 'direct' && otherMember
                            ? otherMember.avatar
                            : null;
                        const time = lastMsg.created_at ? formatMessageTime(lastMsg.created_at) : '';
                        const preview = lastMsg.content ? (lastMsg.content.length > 50 ? lastMsg.content.substring(0, 50) + '...' : lastMsg.content) : 'No messages yet';
                
                        return `
                            <div class="comm-conv-item ${isActive ? 'active' : ''}" data-conv-id="${conv.id}" onclick="selectConversation('${conv.id}')" style="padding: 12px 16px; cursor: pointer; border-bottom: 1px solid var(--border); transition: background 0.2s; ${isActive ? 'background: var(--bg-hover);' : ''}">
                                <div style="display: flex; gap: 12px;">
                                    <div class="user-avatar" style="width: 44px; height: 44px; font-size: 16px; flex-shrink: 0;">${avatar ? `<img src="${avatar}" style="width:100%;height:100%;object-fit:cover;border-radius:50%">` : (name?.charAt(0) || '💬')}</div>
                                    <div style="flex: 1; min-width: 0;">
                                        <div style="display: flex; justify-content: space-between; align-items: flex-start;">
                                            <div style="font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">${name}</div>
                                            <div style="font-size: 11px; color: var(--text-muted); white-space: nowrap; margin-left: 8px;">${time}</div>
                                        </div>
                                        <div style="display: flex; justify-content: space-between; align-items: center; margin-top: 4px;">
                                            <div style="font-size: 12px; color: var(--text-muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">${preview}</div>
                                            ${unread > 0 ? `<span class="badge badge-success" style="font-size: 10px; padding: 2px 6px;">${unread > 9 ? '9+' : unread}</span>` : ''}
                                        </div>
                                    </div>
                                </div>
                            </div>
                        `;
                    }).join('');
                }

                function filterConversations(query) {
                    const items = $$('.comm-conv-item');
                    const q = query.toLowerCase();
                    items.forEach(item => {
                        const name = item.querySelector('[style*="font-weight: 500"]')?.textContent?.toLowerCase() || '';
                        const preview = item.querySelector('[style*="font-size: 12px"]')?.textContent?.toLowerCase() || '';
                        item.style.display = (name.includes(q) || preview.includes(q)) ? '' : 'none';
                    });
                }

                async function selectConversation(convId) {
                    if (!commCenter) return;
            
                    // Mark as read
                    await commCenter.markConversationAsRead(convId);
            
                    // Load conversation details
                    const conv = await commCenter.getConversation(convId);
                    if (!conv) return;
            
                    commCenter.setActiveConversation(conv);
            
                    // Update UI
                    $$('.comm-conv-item').forEach(item => {
                        item.classList.toggle('active', item.dataset.convId === convId);
                    });
            
                    // Update chat header
                    const otherMember = conv.members?.find(m => m.id !== teacherData.id);
                    const name = conv.type === 'direct' && otherMember 
                        ? (otherMember.name || otherMember.first_name + ' ' + otherMember.last_name)
                        : conv.name || 'Group Chat';
                    const avatar = conv.type === 'direct' && otherMember ? otherMember.avatar : null;
                    const presence = otherMember ? commCenter.getUserPresence(otherMember.id) : null;
            
                    $('#commChatHeader').innerHTML = `
                        <div class="comm-chat-title" style="display: flex; align-items: center; gap: 12px;">
                            <div class="user-avatar" style="width: 40px; height: 40px; position: relative;">${avatar ? `<img src="${avatar}" style="width:100%;height:100%;object-fit:cover;border-radius:50%">` : (name?.charAt(0) || '💬')}
                                ${presence?.status === 'online' ? '<span style="position:absolute;bottom:0;right:0;width:10px;height:10px;background:var(--success);border:2px solid var(--bg);border-radius:50%"></span>' : ''}
                            </div>
                            <div>
                                <div style="font-weight: 600;">${name}</div>
                                <div style="font-size: 12px; color: var(--text-muted);">${presence?.status === 'online' ? 'Online' : presence?.status === 'away' ? 'Away' : 'Offline'}</div>
                            </div>
                        </div>
                        <div class="comm-chat-actions" style="display: flex; gap: 8px;">
                            <button class="btn btn-sm btn-secondary" onclick="openConversationInfo()">Info</button>
                        </div>
                    `;
            
                    // Show input area
                    $('#commInputArea').style.display = 'block';
                    $('#commEmpty')?.remove();
                    $('#commMessages .comm-empty')?.remove();
            
                    // Load messages
                    loadMessages(convId);
            
                    // Join conversation room
                    if (commCenter.socket) {
                        commCenter.socket.emit('join_conversation', convId);
                    }
                }

                async function loadMessages(convId, before = null) {
                    const container = $('#commMessages');
                    if (!container) return;
            
                    const messages = await commCenter.loadMessages(convId, 50, before);
                    if (messages.length === 0 && !before) {
                        container.innerHTML = '<div class="comm-empty" style="flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; color: var(--text-muted); text-align: center; padding: 24px;"><p>No messages yet. Start the conversation!</p></div>';
                        return;
                    }
            
                    // Prepend older messages (before) or append new messages
                    const frag = document.createDocumentFragment();
                    messages.forEach(msg => {
                        const el = createMessageElement(msg);
                        if (before) {
                            frag.prepend(el);
                        } else {
                            frag.appendChild(el);
                        }
                    });
            
                    if (before) {
                        const firstChild = container.firstChild;
                        container.insertBefore(frag, firstChild);
                    } else {
                        // Replace empty state if present
                        const empty = container.querySelector('.comm-empty');
                        if (empty) empty.remove();
                        container.appendChild(frag);
                        container.scrollTop = container.scrollHeight;
                    }
                }

                function createMessageElement(msg) {
                    const isOwn = msg.sender_id === teacherData.id;
                    const senderName = isOwn ? 'You' : (msg.sender_first + ' ' + msg.sender_last);
                    const time = formatMessageTime(msg.created_at);
                    const reactions = msg.reactions || [];
            
                    const div = document.createElement('div');
                    div.className = `comm-message ${isOwn ? 'own' : ''}`;
                    div.style.cssText = `display: flex; flex-direction: ${isOwn ? 'row-reverse' : 'row'}; gap: 8px; max-width: 75%; align-self: ${isOwn ? 'flex-end' : 'flex-start'}; animation: slideIn 0.2s ease;`;
                    div.dataset.msgId = msg.id;
            
                    const reactionsHtml = reactions.length > 0 ? `
                        <div style="display: flex; gap: 4px; margin-top: 4px; flex-wrap: wrap;">
                            ${reactions.map(r => `
                                <span class="reaction" style="display: inline-flex; align-items: center; gap: 4px; padding: 2px 8px; background: var(--primary); border-radius: 12px; font-size: 11px; cursor: pointer;" onclick="toggleReaction('${msg.id}', '${r.reaction}')">
                                    <span>${r.reaction}</span>
                                    <span>${r.users?.length || 0}</span>
                                </span>
                            `).join('')}
                        </div>
                    ` : '';
            
                    div.innerHTML = `
                        <div style="width: 32px; height: 32px; border-radius: 50%; background: ${isOwn ? 'var(--accent)' : 'var(--border)'}; display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 600; color: ${isOwn ? 'var(--primary)' : 'var(--text-muted)'}; flex-shrink: 0; margin-top: 2px;">
                            ${msg.sender_avatar ? `<img src="${msg.sender_avatar}" style="width:100%;height:100%;object-fit:cover;border-radius:50%">` : senderName?.charAt(0) || '?'}
                        </div>
                        <div style="flex: 1; min-width: 0;">
                            ${!isOwn ? `<div style="font-size: 11px; font-weight: 500; color: var(--text-muted); margin-bottom: 2px;">${senderName}</div>` : ''}
                            <div style="background: ${isOwn ? 'var(--accent)' : 'var(--bg-card)'}; color: ${isOwn ? 'var(--primary)' : 'var(--text)'}; padding: 10px 14px; border-radius: ${isOwn ? '18px 18px 4px 18px' : '18px 18px 18px 4px'}; position: relative;">
                                <div style="white-space: pre-wrap; word-break: break-word;">${escapeHtml(msg.content || '')}</div>
                                <div style="display: flex; justify-content: space-between; align-items: center; margin-top: 4px; font-size: 10px; color: var(--text-muted);">
                                    <span>${time}</span>
                                    <span>${msg.read_count > 0 ? '✓✓' : '✓'}</span>
                                </div>
                                ${reactionsHtml}
                            </div>
                        </div>
                    `;
            
                    // Context menu for message actions
                    div.addEventListener('contextmenu', (e) => {
                        e.preventDefault();
                        showMessageContextMenu(e, msg);
                    });
            
                    return div;
                }

                function escapeHtml(text) {
                    const div = document.createElement('div');
                    div.textContent = text;
                    return div.innerHTML;
                }

                function formatMessageTime(dateString) {
                    const date = new Date(dateString);
                    const today = new Date();
                    if (date.toDateString() === today.toDateString()) {
                        return date.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
                    } else {
                        return date.toLocaleDateString() + ' ' + date.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
                    }
                }

                async function sendMessage() {
                    const input = $('#commMessageInput');
                    if (!input || !input.value.trim() || !commCenter?.activeConversation) return;
            
                    const content = input.value.trim();
                    input.value = '';
                    input.style.height = 'auto';
            
                    try {
                        const message = await commCenter.sendMessage(commCenter.activeConversation.id, content);
                        // Message will appear via socket event
                    } catch (e) {
                        showToast(e.message || 'Failed to send message', 'error');
                    }
                }

                function toggleReaction(messageId, reaction) {
                    if (commCenter) {
                        commCenter.addReaction(messageId, reaction).catch(() => {
                            commCenter.removeReaction(messageId, reaction);
                        });
                    }
                }

                function updateTypingIndicator(typingUsers) {
                    const container = $('#commTyping');
                    if (!container) return;
            
                    const convId = commCenter?.activeConversation?.id;
                    const users = convId ? typingUsers.get(convId)?.users || [] : [];
            
                    if (users.length === 0) {
                        container.textContent = '';
                    } else if (users.length === 1) {
                        container.textContent = `${users[0]} is typing...`;
                    } else if (users.length === 2) {
                        container.textContent = `${users[0]} and ${users[1]} are typing...`;
                    } else {
                        container.textContent = `${users.length} people are typing...`;
                    }
                }

                function updatePresenceIndicators(presence) {
                    // Update presence in conversation list
                    $$('.comm-conv-item').forEach(item => {
                        // Could add presence dots here
                    });
                }

                function handleNewMessage(message) {
                    if (commCenter?.activeConversation?.id === message.conversation_id) {
                        const container = $('#commMessages');
                        if (container) {
                            const empty = container.querySelector('.comm-empty');
                            if (empty) empty.remove();
                            container.appendChild(createMessageElement(message));
                            container.scrollTop = container.scrollHeight;
                        }
                    }
                }

                function showMessageContextMenu(e, msg) {
                    // Simple context menu for message actions
                    const isOwn = msg.sender_id === teacherData.id;
                    const menu = document.createElement('div');
                    menu.style.cssText = `position: fixed; top: ${e.clientY}px; left: ${e.clientX}px; background: var(--bg-card); border: 1px solid var(--border); border-radius: 8px; padding: 8px 0; z-index: 1000; min-width: 180px; box-shadow: 0 10px 40px rgba(0,0,0,0.4);`;
                    menu.innerHTML = `
                        <button class="context-menu-item" onclick="replyToMessage('${msg.id}')" style="width:100%;padding:10px 16px;text-align:left;border:none;background:none;color:var(--text);font-size:13px;cursor:pointer;">Reply</button>
                        <button class="context-menu-item" onclick="copyMessage('${msg.id}')" style="width:100%;padding:10px 16px;text-align:left;border:none;background:none;color:var(--text);font-size:13px;cursor:pointer;">Copy</button>
                        ${isOwn ? `
                            <button class="context-menu-item" onclick="editMessage('${msg.id}')" style="width:100%;padding:10px 16px;text-align:left;border:none;background:none;color:var(--text);font-size:13px;cursor:pointer;">Edit</button>
                            <button class="context-menu-item" onclick="deleteMessage('${msg.id}')" style="width:100%;padding:10px 16px;text-align:left;border:none;background:none;color:var(--danger);font-size:13px;cursor:pointer;">Delete</button>
                        ` : ''}
                        <button class="context-menu-item" onclick="addReactionMenu('${msg.id}')" style="width:100%;padding:10px 16px;text-align:left;border:none;background:none;color:var(--text);font-size:13px;cursor:pointer;">Add Reaction</button>
                    `;
                    document.body.appendChild(menu);
                    const close = () => { menu.remove(); document.removeEventListener('click', close); };
                    setTimeout(() => document.addEventListener('click', close), 0);
                }

                function openNewConversation() {
                    // Open modal to select users for new conversation
                    openModal('New Conversation', `
                        <div class="form-group" style="margin-bottom: 16px;">
                            <label>Type</label>
                            <select id="newConvType" onchange="toggleNewConvType()">
                                <option value="direct">Direct Message</option>
                                <option value="group">Group Chat</option>
                            </select>
                        </div>
                        <div class="form-group" id="newConvNameGroup" style="display: none;">
                            <label>Group Name</label>
                            <input type="text" id="newConvName" placeholder="Enter group name">
                        </div>
                        <div class="form-group">
                            <label>Select Users</label>
                            <input type="text" class="student-search" placeholder="Search users..." oninput="filterNewConvUsers(this.value)" style="margin-bottom: 8px;">
                            <div class="student-list" id="newConvUserList" style="max-height: 300px;"></div>
                        </div>
                    `, `
                        <button class="btn btn-secondary" onclick="closeModal()">Cancel</button>
                        <button class="btn btn-primary" onclick="createNewConversation()">Create</button>
                    `);
            
                    // Load users for selection
                    loadNewConvUsers();
                }

                function toggleNewConvType() {
                    const type = $('#newConvType').value;
                    $('#newConvNameGroup').style.display = type === 'group' ? 'block' : 'none';
                }

                async function loadNewConvUsers() {
                    const users = await commCenter.loadDirectory();
                    $('#newConvUserList').innerHTML = users.map(u => `
                        <label class="student-item" style="display: flex; align-items: center; gap: 12px; padding: 10px 16px; cursor: pointer; transition: background 0.2s;">
                            <input type="checkbox" value="${u.id}" class="new-conv-user-check" style="width: 18px; height: 18px; accent-color: var(--accent);">
                            <div class="user-avatar" style="width: 36px; height: 36px; font-size: 14px;">${u.avatar_url ? `<img src="${u.avatar_url}" style="width:100%;height:100%;object-fit:cover;border-radius:50%">` : (u.first_name?.charAt(0) || '?')}</div>
                            <div>
                                <div style="font-weight: 500;">${u.first_name} ${u.last_name}</div>
                                <div style="font-size: 11px; color: var(--text-muted);">${u.role} • ${u.class || ''} ${u.stream || ''}</div>
                            </div>
                        </label>
                    `).join('');
                }

                function filterNewConvUsers(query) {
                    const items = $$('#newConvUserList .student-item');
                    const q = query.toLowerCase();
                    items.forEach(item => {
                        const name = item.textContent.toLowerCase();
                        item.style.display = name.includes(q) ? '' : 'none';
                    });
                }

                async function createNewConversation() {
                    const type = $('#newConvType').value;
                    const name = type === 'group' ? $('#newConvName').value : '';
                    const memberIds = Array.from($$('.new-conv-user-check:checked')).map(cb => cb.value);
            
                    if (memberIds.length === 0) {
                        showToast('Select at least one user', 'error');
                        return;
                    }
            
                    if (type === 'group' && !name) {
                        showToast('Enter a group name', 'error');
                        return;
                    }
            
                    try {
                        const conversation = await commCenter.createConversation(type, name, '', memberIds);
                        closeModal();
                        await selectConversation(conversation.id);
                    } catch (e) {
                        showToast(e.message || 'Failed to create conversation', 'error');
                    }
                }

                // ===== BOOTSTRAP =====
            openModal('Create Announcement', `
                <form id="announcementForm">
                    <div class="form-group"><label>Title</label><input type="text" id="annTitle" required></div>
                    <div class="form-group"><label>Message</label><textarea id="annMessage" required></textarea></div>
                    <div class="form-group"><label>Priority</label><select id="annPriority"><option value="normal">Normal</option><option value="high">High</option></select></div>
                </form>`, '<button class="btn btn-secondary" onclick="closeModal()">Cancel</button><button class="btn btn-primary" onclick="submitAnnouncement()">Publish</button>');
        }

        async function submitAnnouncement() {
            const title = $('#annTitle').value, message = $('#annMessage').value, priority = $('#annPriority').value;
            try {
                await apiCall('/announcements', { method: 'POST', body: JSON.stringify({ title, message, priority }) });
                showToast('Announcement published!', 'success');
                closeModal();
                loadPage('announcements');
            } catch(e) { showToast(e.message || 'Failed to create', 'error'); }
        }

        // ===== PROFILE (MOST IMPORTANT) =====
        async function renderProfile(container) {
            const teacher = teacherData || {};
            let subjects = [];
            try { subjects = await apiCall('/subjects') || []; } catch(e) {}
            if (!Array.isArray(subjects)) subjects = [];
            const teacherSubjects = teacher.subjects || [];
            const photoUrl = teacher.photo || '';
            container.innerHTML = `
                <div class="card">
                    <div class="card-header"><h3 class="card-title">Teacher Profile</h3></div>
                    <div class="photo-upload">
                        <div class="photo-preview" id="profilePhotoPreview">${(teacher.name||'T').split(' ').map(n=>n[0]).join('').toUpperCase().slice(0,2)}
                            ${photoUrl ? `<img src="${photoUrl}" onerror="this.parentElement.textContent='${(teacher.name||'T').split(' ').map(n=>n[0]).join('').toUpperCase().slice(0,2)}'">` : ''}
                        </div>
                        <div class="photo-info">
                            <strong>Profile Photo</strong>
                            <p>JPG, PNG or GIF. Max 2MB.</p>
                            <input type="file" id="photoInput" accept="image/*" style="margin-top:8px">
                        </div>
                    </div>
                    <form id="profileForm">
                        <div class="form-row">
                            <div class="form-group"><label>Full Name</label><input type="text" id="profileName" value="${teacher.name||''}" required></div>
                            <div class="form-group"><label>Email</label><input type="email" id="profileEmail" value="${teacher.email||''}" required></div>
                        </div>
                        <div class="form-row">
                            <div class="form-group"><label>Phone</label><input type="tel" id="profilePhone" value="${teacher.phone||''}"></div>
                            <div class="form-group"><label>Subjects</label>
                                <select id="profileSubjects" multiple style="height:120px">${subjects.map(s => `<option value="${s.id}" ${teacherSubjects.some(ts=>ts.id===s.id||ts===s.id)?'selected':''}>${s.name}</option>`).join('')}</select>
                            </div>
                        </div>
                        <button type="button" class="btn btn-primary" onclick="saveProfile()">Save Changes</button>
                    </form>
                </div>
                <div class="card">
                    <div class="card-header"><h3 class="card-title">Change Password</h3></div>
                    <form id="passwordForm">
                        <div class="form-group"><label>Current Password</label><input type="password" id="currentPassword" required></div>
                        <div class="form-row">
                            <div class="form-group"><label>New Password</label><input type="password" id="newPassword" minlength="6" required></div>
                            <div class="form-group"><label>Confirm New Password</label><input type="password" id="confirmPassword" minlength="6" required></div>
                        </div>
                        <button type="button" class="btn btn-danger" onclick="changePassword()">Change Password</button>
                    </form>
                </div>`;
        }

        async function saveProfile() {
            const name = $('#profileName').value, email = $('#profileEmail').value, phone = $('#profilePhone').value;
            const subjectSelects = $$('#profileSubjects option:checked');
            const subjects = Array.from(subjectSelects).map(o => o.value);
            const photoInput = $('#photoInput');
            const formData = new FormData();
            formData.append('name', name);
            formData.append('email', email);
            formData.append('phone', phone);
            subjects.forEach(s => formData.append('subjects[]', s));
            if (photoInput.files[0]) formData.append('photo', photoInput.files[0]);
            try {
                const updated = await apiCall('/teacher/profile', { method: 'PUT', body: formData });
                teacherData = { ...teacherData, ...updated };
                if (updated.name || updated.email || updated.phone) {
                    if (updated.name) teacherData.name = updated.name;
                    if (updated.email) teacherData.email = updated.email;
                    if (updated.phone) teacherData.phone = updated.phone;
                }
                updateSidebarUser();
                showToast('Profile updated!', 'success');
                if (photoInput.files[0]) loadPage('profile');
            } catch(e) { showToast(e.message || 'Failed to update profile', 'error'); }
        }

        async function changePassword() {
            const current = $('#currentPassword').value, np = $('#newPassword').value, cp = $('#confirmPassword').value;
            if (np !== cp) { showToast('Passwords do not match', 'error'); return; }
            if (np.length < 6) { showToast('Password must be at least 6 characters', 'error'); return; }
            try {
                await apiCall('/change-password', { method: 'POST', body: JSON.stringify({ currentPassword: current, newPassword: np }) });
                showToast('Password changed successfully!', 'success');
                $('#passwordForm').reset();
            } catch(e) { showToast(e.message || 'Failed to change password', 'error'); }
        }

        // ===== BOOTSTRAP =====
                if (getToken()) initApp();
                else { $('#loginScreen').classList.remove('hidden'); $('#appLayout').classList.add('hidden'); }
   
            // Mobile Menu Toggle
            function toggleMobileMenu() {
              const sidebar = document.querySelector('.sidebar');
              if (sidebar) sidebar.classList.toggle('open');
              document.getElementById('mobileBtn').classList.toggle('active');
            }

        </script>
        <script src="/assets/js/theme-manager.js"></script>
        <script src="/assets/js/theme-toolbar.js"></script>
        </body>
