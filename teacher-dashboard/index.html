<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Teacher Dashboard | Kalinabiri SS</title>
    <link rel="icon" type="image/x-icon" href="/assets/images/logo.ico">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #0a1f0a;
            --primary-light: #122412;
            --primary-dark: #050f05;
            --accent: #4ade80;
            --accent-dark: #22c55e;
            --accent-light: #86efac;
            --bg: #0d1a0d;
            --bg-card: #142814;
            --bg-hover: #1a3a1a;
            --text: #e8f5e8;
            --text-muted: #8ba88b;
            --border: #2a4a2a;
            --danger: #ef4444;
            --warning: #f59e0b;
            --success: #22c55e;
            --sidebar-width: 260px;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Inter', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; }
        a { color: var(--accent); text-decoration: none; }
        button { cursor: pointer; font-family: inherit; }
        input, select, textarea { font-family: inherit; }

        /* Login Screen */
        .login-screen { display: flex; align-items: center; justify-content: center; min-height: 100vh; padding: 20px; }
        .login-card { background: var(--bg-card); border: 1px solid var(--border); border-radius: 16px; padding: 48px; width: 100%; max-width: 420px; }
        .login-logo { text-align: center; margin-bottom: 32px; }
        .login-logo h1 { font-size: 28px; font-weight: 700; color: var(--accent); margin-bottom: 8px; }
        .login-logo p { color: var(--text-muted); font-size: 14px; }
        .form-group { margin-bottom: 20px; }
        .form-group label { display: block; margin-bottom: 8px; font-size: 14px; font-weight: 500; color: var(--text-muted); }
        .form-group input { width: 100%; padding: 12px 16px; background: var(--primary); border: 1px solid var(--border); border-radius: 8px; color: var(--text); font-size: 14px; transition: border-color 0.2s; }
        .form-group input:focus { outline: none; border-color: var(--accent); }
    /* Mobile Menu */
    .mobile-menu-btn {
      display: none;
      background: none;
      border: none;
      cursor: pointer;
      padding: 0.5rem;
    }

    .mobile-menu-btn span {
      display: block;
      width: 24px;
      height: 2px;
      background: var(--accent-green);
      margin: 5px 0;
      transition: all 0.3s ease;
    }

    .mobile-menu-btn.active span:nth-child(1) {
      transform: translateY(7px) rotate(45deg);
    }
    .mobile-menu-btn.active span:nth-child(2) { opacity: 0; }
    .mobile-menu-btn.active span:nth-child(3) {
      transform: translateY(-7px) rotate(-45deg);
    }

    @media (max-width: 1000px) {
      .nav-links {
        position: fixed;
        top: 68px;
        left: 0;
        right: 0;
        flex-direction: column;
        background: rgba(10, 31, 10, 0.98);
        backdrop-filter: blur(20px);
        padding: 1.5rem;
        gap: 0.5rem;
        border-bottom: 1px solid var(--glass-border);
        transform: translateY(-120%);
        opacity: 0;
        transition: all 0.4s ease;
        pointer-events: none;
        z-index: 999;
      }
      .nav-links.mobile-open {
        transform: translateY(0);
        opacity: 1;
        pointer-events: all;
      }
      .nav-links li { width: 100%; text-align: center; }
      .nav-links a { display: block; padding: 0.75rem; font-size: 1rem; }
      .navbar { padding: 0.75rem 1.5rem; }
      .mobile-menu-btn { display: block; }
      .nav-cta { display: none; }
    }


        .btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; padding: 12px 24px; border: none; border-radius: 8px; font-size: 14px; font-weight: 500; transition: all 0.2s; }
        .btn-primary { background: var(--accent); color: var(--primary); }
        .btn-primary:hover { background: var(--accent-dark); }
        .btn-secondary { background: var(--bg-hover); color: var(--text); border: 1px solid var(--border); }
        .btn-secondary:hover { background: var(--primary-light); }
        .btn-danger { background: var(--danger); color: white; }
        .btn-sm { padding: 8px 16px; font-size: 13px; }
        .btn-block { width: 100%; }

        /* Main Layout */
        .app-layout { display: flex; min-height: 100vh; }
        .sidebar { width: var(--sidebar-width); background: var(--primary); border-right: 1px solid var(--border); position: fixed; height: 100vh; display: flex; flex-direction: column; z-index: 100; }
        .sidebar-header { padding: 24px 20px; border-bottom: 1px solid var(--border); }
        .sidebar-logo { font-size: 20px; font-weight: 700; color: var(--accent); }
        .sidebar-subtitle { font-size: 12px; color: var(--text-muted); margin-top: 4px; }
        .sidebar-nav { flex: 1; padding: 16px 12px; overflow-y: auto; }
        .nav-item { display: flex; align-items: center; gap: 12px; padding: 12px 16px; border-radius: 8px; color: var(--text-muted); font-size: 14px; font-weight: 500; cursor: pointer; transition: all 0.2s; margin-bottom: 4px; }
        .nav-item:hover { background: var(--bg-hover); color: var(--text); }
        .nav-item.active { background: var(--accent); color: var(--primary); }
        .nav-item svg { width: 20px; height: 20px; flex-shrink: 0; }
        .sidebar-footer { padding: 16px 12px; border-top: 1px solid var(--border); }
        .user-info { display: flex; align-items: center; gap: 12px; padding: 12px; background: var(--bg-card); border-radius: 8px; margin-bottom: 12px; }
        .user-avatar { width: 40px; height: 40px; border-radius: 50%; background: var(--accent); display: flex; align-items: center; justify-content: center; font-weight: 600; color: var(--primary); font-size: 16px; }
        .user-avatar img { width: 40px; height: 40px; border-radius: 50%; object-fit: cover; }
        .user-details { flex: 1; min-width: 0; }
        .user-name { font-size: 14px; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .user-role { font-size: 12px; color: var(--text-muted); }

        .main-content { flex: 1; margin-left: var(--sidebar-width); display: flex; flex-direction: column; }
        .topbar { background: var(--primary); border-bottom: 1px solid var(--border); padding: 16px 24px; display: flex; align-items: center; justify-content: space-between; position: sticky; top: 0; z-index: 50; }
        .topbar-left { display: flex; align-items: center; gap: 12px; }
        .page-title { font-size: 20px; font-weight: 600; }
        .topbar-actions { display: flex; align-items: center; gap: 16px; }
        .notification-bell { position: relative; cursor: pointer; padding: 8px; border-radius: 8px; transition: background 0.2s; }
        .notification-bell:hover { background: var(--bg-hover); }
        .notification-badge { position: absolute; top: 4px; right: 4px; background: var(--danger); color: white; font-size: 10px; font-weight: 600; min-width: 18px; height: 18px; border-radius: 9px; display: flex; align-items: center; justify-content: center; padding: 0 5px; }
        .notifications-dropdown { position: absolute; top: 100%; right: 0; width: 360px; background: var(--bg-card); border: 1px solid var(--border); border-radius: 12px; box-shadow: 0 10px 40px rgba(0,0,0,0.4); display: none; z-index: 200; }
        .notifications-dropdown.show { display: block; }
        .notifications-header { padding: 16px; border-bottom: 1px solid var(--border); font-weight: 600; display: flex; justify-content: space-between; align-items: center; }
        .notifications-list { max-height: 400px; overflow-y: auto; }
        .notification-item { padding: 12px 16px; border-bottom: 1px solid var(--border); cursor: pointer; transition: background 0.2s; }
        .notification-item:hover { background: var(--bg-hover); }
        .notification-item:last-child { border-bottom: none; }
        .notification-title { font-size: 14px; font-weight: 500; margin-bottom: 4px; }
        .notification-time { font-size: 12px; color: var(--text-muted); }
        .notification-empty { padding: 32px; text-align: center; color: var(--text-muted); }

        .page-content { flex: 1; padding: 24px; }

        /* Cards & Stats */
        .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 16px; margin-bottom: 24px; }
        .stat-card { background: var(--bg-card); border: 1px solid var(--border); border-radius: 12px; padding: 20px; }
        .stat-icon { width: 48px; height: 48px; border-radius: 10px; background: var(--bg-hover); display: flex; align-items: center; justify-content: center; margin-bottom: 16px; }
        .stat-icon svg { width: 24px; height: 24px; color: var(--accent); }
        .stat-value { font-size: 32px; font-weight: 700; margin-bottom: 4px; }
        .stat-label { font-size: 14px; color: var(--text-muted); }

        .card { background: var(--bg-card); border: 1px solid var(--border); border-radius: 12px; padding: 24px; margin-bottom: 24px; }
        .card-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 20px; }
        .card-title { font-size: 18px; font-weight: 600; }

        /* Tables */
        .table-wrapper { overflow-x: auto; }
        table { width: 100%; border-collapse: collapse; }
        th, td { padding: 12px 16px; text-align: left; border-bottom: 1px solid var(--border); }
        th { font-size: 12px; font-weight: 600; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.5px; }
        td { font-size: 14px; }
        tbody tr:hover { background: var(--bg-hover); }

        /* Badges */
        .badge { display: inline-flex; align-items: center; padding: 4px 10px; border-radius: 20px; font-size: 12px; font-weight: 500; }
        .badge-success { background: rgba(74, 222, 128, 0.15); color: var(--accent); }
        .badge-warning { background: rgba(245, 158, 11, 0.15); color: var(--warning); }
        .badge-danger { background: rgba(239, 68, 68, 0.15); color: var(--danger); }

        /* Modals */
        .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.7); display: none; align-items: center; justify-content: center; z-index: 300; padding: 20px; }
        .modal-overlay.show { display: flex; }
        .modal { background: var(--bg-card); border: 1px solid var(--border); border-radius: 16px; width: 100%; max-width: 560px; max-height: 90vh; overflow: hidden; display: flex; flex-direction: column; }
        .modal-lg { max-width: 800px; }
        .modal-header { padding: 20px 24px; border-bottom: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; }
        .modal-title { font-size: 18px; font-weight: 600; }
        .modal-close { width: 32px; height: 32px; border: none; background: var(--bg-hover); border-radius: 8px; color: var(--text); cursor: pointer; display: flex; align-items: center; justify-content: center; transition: background 0.2s; }
        .modal-close:hover { background: var(--danger); color: white; }
        .modal-body { padding: 24px; overflow-y: auto; flex: 1; }
        .modal-footer { padding: 16px 24px; border-top: 1px solid var(--border); display: flex; justify-content: flex-end; gap: 12px; }

        /* Form elements */
        .form-row { display: grid; grid-template-columns: repeat(2, 1fr); gap: 16px; }
        .form-full { grid-column: 1 / -1; }
        textarea { width: 100%; padding: 12px 16px; background: var(--primary); border: 1px solid var(--border); border-radius: 8px; color: var(--text); font-size: 14px; resize: vertical; min-height: 100px; }
        textarea:focus { outline: none; border-color: var(--accent); }
        select { width: 100%; padding: 12px 16px; background: var(--primary); border: 1px solid var(--border); border-radius: 8px; color: var(--text); font-size: 14px; cursor: pointer; }
        select:focus { outline: none; border-color: var(--accent); }

        /* Photo upload */
        .photo-upload { display: flex; align-items: center; gap: 20px; margin-bottom: 24px; }
        .photo-preview { width: 80px; height: 80px; border-radius: 50%; background: var(--accent); display: flex; align-items: center; justify-content: center; font-size: 28px; font-weight: 600; color: var(--primary); overflow: hidden; }
        .photo-preview img { width: 100%; height: 100%; object-fit: cover; }
        .photo-info { flex: 1; }
        .photo-info p { font-size: 13px; color: var(--text-muted); margin-top: 4px; }

        /* Student search/checkbox list */
        .student-search { margin-bottom: 16px; }
        .student-list { max-height: 250px; overflow-y: auto; border: 1px solid var(--border); border-radius: 8px; }
        .student-item { display: flex; align-items: center; gap: 12px; padding: 10px 16px; cursor: pointer; transition: background 0.2s; }
        .student-item:hover { background: var(--bg-hover); }
        .student-item input[type="checkbox"] { width: 18px; height: 18px; accent-color: var(--accent); }

        /* Attendance marks */
        .attendance-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
        .attendance-btn { padding: 8px 16px; border: 1px solid var(--border); border-radius: 8px; background: var(--primary); color: var(--text-muted); font-size: 13px; font-weight: 500; cursor: pointer; transition: all 0.2s; }
        .attendance-btn:hover { border-color: var(--accent); color: var(--text); }
        .attendance-btn.present { background: rgba(74, 222, 128, 0.2); border-color: var(--accent); color: var(--accent); }
        .attendance-btn.absent { background: rgba(239, 68, 68, 0.2); border-color: var(--danger); color: var(--danger); }
        .attendance-btn.late { background: rgba(245, 158, 11, 0.2); border-color: var(--warning); color: var(--warning); }

        /* Toast notifications */
        .toast-container { position: fixed; bottom: 24px; right: 24px; z-index: 500; display: flex; flex-direction: column; gap: 12px; }
        .toast { background: var(--bg-card); border: 1px solid var(--border); border-radius: 12px; padding: 16px 20px; display: flex; align-items: center; gap: 12px; box-shadow: 0 10px 40px rgba(0,0,0,0.4); animation: slideIn 0.3s ease; min-width: 300px; }
        .toast-success { border-left: 4px solid var(--success); }
        .toast-error { border-left: 4px solid var(--danger); }
        .toast-warning { border-left: 4px solid var(--warning); }
        .toast-icon { width: 24px; height: 24px; flex-shrink: 0; }
        .toast-success .toast-icon { color: var(--success); }
        .toast-error .toast-icon { color: var(--danger); }
        .toast-warning .toast-icon { color: var(--warning); }
        .toast-message { flex: 1; font-size: 14px; }
        @keyframes slideIn { from { transform: translateX(100%); opacity: 0; } to { transform: translateX(0); opacity: 1; } }

        /* Utility */
        .hidden { display: none !important; }
        .text-muted { color: var(--text-muted); }
        .text-sm { font-size: 13px; }
        .mt-4 { margin-top: 16px; }
        .mb-4 { margin-bottom: 16px; }
        .flex { display: flex; }
        .items-center { align-items: center; }
        .gap-2 { gap: 8px; }
        .grid-2 { display: grid; grid-template-columns: repeat(2, 1fr); gap: 16px; }

        /* Grade input */
        .grade-input { width: 80px; padding: 8px; background: var(--primary); border: 1px solid var(--border); border-radius: 6px; color: var(--text); font-size: 14px; text-align: center; }
        .grade-input:focus { outline: none; border-color: var(--accent); }

        /* Loading spinner */
        .spinner { width: 20px; height: 20px; border: 2px solid var(--border); border-top-color: var(--accent); border-radius: 50%; animation: spin 0.8s linear infinite; }
        @keyframes spin { to { transform: rotate(360deg); } }
        .loading-overlay { display: flex; align-items: center; justify-content: center; padding: 40px; }
    </style>
</head>

        <!-- Main Content -->
        <main class="main-content">
            <header class="topbar">
                <div class="topbar-left">
                    <button class="mobile-menu-btn" id="mobileBtn" onclick="toggleMobileMenu()" aria-label="Toggle navigation menu">
                        <span></span>
                        <span></span>
                        <span></span>
                    </button>
                    <h1 class="page-title" id="pageTitle">Dashboard</h1>
                </div>
                <div class="topbar-actions">
                    <div class="notification-bell" id="notificationBell">
                        <svg width="24" height="24" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 17h5l-1.405-1.405A2.032 2.032 0 0118 14.158V11a6.002 6.002 0 00-4-5.659V5a2 2 0 10-4 0v.341C7.67 6.165 6 8.388 6 11v3.159c0 .538-.214 1.055-.595 1.436L4 17h5m6 0v1a3 3 0 11-6 0v-1m6 0H9"/></svg>

                            <button class="btn btn-sm btn-secondary" onclick="markAllRead()">Mark all read</button>
                        </div>
                        <div class="notifications-list" id="notifList">
                            <div class="notification-empty">No notifications</div>
                        </div>
                    </div>
                </div>
            </header>

            <div class="page-content" id="pageContent">
                <!-- Dynamic content loads here -->
            </div>
        </main>
    </div>

    <!-- Modals -->
    <div class="modal-overlay" id="modalOverlay">
        <div class="modal" id="modalContent">
            <div class="modal-header">
                <h2 class="modal-title" id="modalTitle">Modal</h2>
                <button class="modal-close" onclick="closeModal()">&times;</button>
            </div>
            <div class="modal-body" id="modalBody"></div>
            <div class="modal-footer" id="modalFooter"></div>
        </div>
    </div>

    <!-- Toast Container -->
    <div class="toast-container" id="toastContainer"></div>

    <script src="/assets/js/api.js"></script>
    <script src="/shared/communication-center.js"></script>
    <script>
        const API = KalinabiriAPI.API_BASE;
        const TOKEN_KEY = 'kalinabiri_token';

        // ===== STATE =====
        let currentPage = 'dashboard';
        let teacherData = null;
        let teacherClasses = [];
        let allStudents = [];
        let notifications = [];
        let notifPollInterval = null;

        // ===== HELPERS =====
        const getToken = () => KalinabiriAPI.getToken();
        const setToken = (t) => KalinabiriAPI.setToken(t);
        const removeToken = () => KalinabiriAPI.removeToken();

        function $(sel) { return document.querySelector(sel); }
        function $$(sel) { return document.querySelectorAll(sel); }

        // ===== TOAST =====
        function showToast(message, type = 'success') {
            const container = $('#toastContainer');
            const icons = { success: '<svg class="toast-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"/></svg>', error: '<svg class="toast-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/></svg>', warning: '<svg class="toast-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"/></svg>' };
            const toast = document.createElement('div');
            toast.className = `toast toast-${type}`;
            toast.innerHTML = `${icons[type]}<span class="toast-message">${message}</span>`;
            container.appendChild(toast);
            setTimeout(() => toast.remove(), 4000);
        }

        // ===== MODAL =====
        function openModal(title, body, footer = '') {
            $('#modalTitle').textContent = title;
            $('#modalBody').innerHTML = body;
            $('#modalFooter').innerHTML = footer;
            $('#modalOverlay').classList.add('show');
        }
        function closeModal() { $('#modalOverlay').classList.remove('show'); }
        $('#modalOverlay').addEventListener('click', (e) => { if (e.target === $('#modalOverlay')) closeModal(); });

        // ===== LOGIN =====
        async function handleLogin(e) {
            e.preventDefault();
            const email = $('#loginEmail').value, password = $('#loginPassword').value;
            const btn = $('#loginBtn');
            btn.disabled = true; btn.innerHTML = '<div class="spinner"></div> Signing in...';
            try {
                const data = await KalinabiriAPI.login(email, password);
                if (data.user.role !== 'teacher') throw new Error('Access denied. Teacher only.');
                showToast('Welcome back!', 'success');
                initApp();
            } catch (err) { showToast(err.message, 'error'); }
            finally { btn.disabled = false; btn.textContent = 'Sign In'; }
        }
        $('#loginForm').addEventListener('submit', handleLogin);

        // ===== LOGOUT =====
        function handleLogout() {
            KalinabiriAPI.clearAuth();
            if (notifPollInterval) clearInterval(notifPollInterval);
            $('#loginScreen').classList.remove('hidden');
            $('#appLayout').classList.add('hidden');
        }
        $('#logoutBtn').addEventListener('click', handleLogout);

        // ===== NAVIGATION =====
        document.querySelectorAll('.nav-item[data-page]').forEach(item => {
            item.addEventListener('click', () => {
                document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
                item.classList.add('active');
                currentPage = item.dataset.page;
                $('#pageTitle').textContent = item.textContent.trim();
                loadPage(currentPage);
            });
        });

        // ===== INIT =====
        async function initApp() {
            try {
                teacherData = await apiCall('/teacher/me');
                teacherClasses = teacherData.classes || [];
                allStudents = [];
                for (const cls of teacherClasses) {
                    try { const s = await apiCall(`/students?classId=${cls.id}`); allStudents.push(...(Array.isArray(s) ? s : s.students || [])); } catch(e) {}
                }
                updateSidebarUser();
                $('#loginScreen').classList.add('hidden');
                $('#appLayout').classList.remove('hidden');
                loadPage('dashboard');
                startNotifPoll();
            } catch (err) { handleLogout(); }
        }

        function updateSidebarUser() {
            const name = teacherData.name || teacherData.email || 'Teacher';
            const initials = name.split(' ').map(n => n[0]).join('').toUpperCase().slice(0,2);
            $('#sidebarName').textContent = name;
            $('#sidebarAvatar').textContent = initials;
            if (teacherData.photo) {
                const img = document.createElement('img');
                img.src = teacherData.photo;
                img.onerror = () => { $('#sidebarAvatar').textContent = initials; };
                $('#sidebarAvatar').innerHTML = '';
                $('#sidebarAvatar').appendChild(img);
            }
        }

        // ===== NOTIFICATIONS =====
        function startNotifPoll() {
            fetchNotifications();
            notifPollInterval = setInterval(fetchNotifications, 30000);
        }
        async function fetchNotifications() {
            try {
                notifications = await KalinabiriAPI.getNotifications();
                if (!Array.isArray(notifications)) notifications = notifications.notifications || [];
                const unread = notifications.filter(n => !n.is_read).length;
                const badge = $('#notifBadge');
                if (unread > 0) { badge.textContent = unread > 9 ? '9+' : unread; badge.style.display = 'flex'; }
                else badge.style.display = 'none';
                renderNotifications();
            } catch(e) {}
        }
        function renderNotifications() {
            const list = $('#notifList');
            if (notifications.length === 0) { list.innerHTML = '<div class="notification-empty">No notifications</div>'; return; }
            list.innerHTML = notifications.map(n => `
                <div class="notification-item" onclick="handleNotifClick('${n.id}')">
                    <div class="notification-title">${n.title || 'Notification'}</div>
                    <div class="notification-time">${n.message || ''} ${n.created_at ? '• ' + timeAgo(n.created_at) : ''}</div>
                </div>`).join('');
        }
        async function handleNotifClick(id) { try { await KalinabiriAPI.markNotificationRead(id); fetchNotifications(); } catch(e) {} }
        async function markAllRead() { try { await KalinabiriAPI.markAllNotificationsRead(); fetchNotifications(); showToast('All notifications marked as read', 'success'); } catch(e) {} }
        function timeAgo(date) { const s = Math.floor((new Date() - new Date(date)) / 1000); if (s < 60) return 'just now'; const m = Math.floor(s/60); if (m < 60) return m+'m ago'; const h = Math.floor(m/60); if (h < 24) return h+'h ago'; return Math.floor(h/24)+'d ago'; }

        $('#notificationBell').addEventListener('click', (e) => { e.stopPropagation(); $('#notifDropdown').classList.toggle('show'); });
        document.addEventListener('click', () => $('#notifDropdown').classList.remove('show'));

        // ===== LOAD PAGE =====
        async function loadPage(page) {
            const content = $('#pageContent');
            content.innerHTML = '<div class="loading-overlay"><div class="spinner"></div></div>';
            try {
                switch(page) {
                    case 'dashboard': await renderDashboard(content); break;
                    case 'classes': await renderClasses(content); break;
                    case 'assessments': await renderAssessments(content); break;
                    case 'attendance': await renderAttendance(content); break;
                    case 'results': await renderResults(content); break;
                    case 'announcements': await renderAnnouncements(content); break;
                    case 'communication': await renderCommunication(content); break;
                    case 'profile': await renderProfile(content); break;
                    default: content.innerHTML = '<p>Page not found</p>';
                }
            } catch(err) { content.innerHTML = `<p class="text-muted">Error loading page: ${err.message}</p>`; }
        }

        // ===== DASHBOARD =====
        async function renderDashboard(container) {
            let activeAssessments = 0, pendingGrades = 0;
            try {
                const assessments = await apiCall('/assessments');
                const submissions = [];
                if (Array.isArray(assessments)) {
                    activeAssessments = assessments.filter(a => a.status !== 'closed').length;
                    for (const a of assessments) {
                        try { const s = await apiCall(`/assessments/${a.id}/submissions`); submissions.push(...(Array.isArray(s) ? s : [])); } catch(e) {}
                    }
                }
                pendingGrades = submissions.filter(s => !s.grade && !s.score && s.status !== 'pending').length;
            } catch(e) {}

            container.innerHTML = `
                <div class="card">
                    <h2 class="card-title">Welcome back, ${teacherData?.name?.split(' ')[0] || 'Teacher'}!</h2>
                    <p class="text-muted mt-4">Here's an overview of your teaching activities.</p>
                </div>
                <div class="stats-grid">
                    <div class="stat-card">
                        <div class="stat-icon"><svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.747 0 3.332.477 4.5 1.253v13C19.832 18.477 18.247 18 16.5 18c-1.746 0-3.332.477-4.5 1.253"/></svg></div>
                        <div class="stat-value">${teacherClasses.length}</div>
                        <div class="stat-label">Assigned Classes</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-icon"><svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2"/></svg></div>
                        <div class="stat-value">${activeAssessments}</div>
                        <div class="stat-label">Active Assessments</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-icon"><svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11.049 2.927c.3-.921 1.603-.921 1.902 0l1.519 4.674a1 1 0 00.95.69h4.915c.969 0 1.371 1.24.588 1.81l-3.976 2.888a1 1 0 00-.363 1.118l1.518 4.674c.3.922-.755 1.688-1.538 1.118l-3.976-2.888a1 1 0 00-1.176 0l-3.976 2.888c-.783.57-1.838-.197-1.538-1.118l1.518-4.674a1 1 0 00-.363-1.118l-3.976-2.888c-.784-.57-.38-1.81.588-1.81h4.914a1 1 0 00.951-.69l1.519-4.674z"/></svg></div>
                        <div class="stat-value">${pendingGrades}</div>
                        <div class="stat-label">Pending Grades</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-icon"><svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 17h5l-1.405-1.405A2.032 2.032 0 0118 14.158V11a6.002 6.002 0 00-4-5.659V5a2 2 0 10-4 0v.341C7.67 6.165 6 8.388 6 11v3.159c0 .538-.214 1.055-.595 1.436L4 17h5m6 0v1a3 3 0 11-6 0v-1m6 0H9"/></svg></div>
                        <div class="stat-value">${notifications.filter(n=>!n.read).length}</div>
                        <div class="stat-label">Unread Notifications</div>
                    </div>
                </div>
                <div class="card">
                    <div class="card-header"><h3 class="card-title">Recent Notifications</h3></div>
                    ${notifications.length === 0 ? '<p class="text-muted">No recent notifications</p>' : notifications.slice(0,5).map(n => `<div style="padding:12px 0;border-bottom:1px solid var(--border)"><strong>${n.title||'Notification'}</strong><p class="text-sm text-muted">${n.message||''}</p><span class="text-sm text-muted">${timeAgo(n.created_at)}</span></div>`).join('')}`}
                </div>`;
        }

        // ===== MY CLASSES =====
        async function renderClasses(container) {
            container.innerHTML = `<div class="card"><div class="card-header"><h3 class="card-title">My Assigned Classes</h3></div><div class="table-wrapper"><table><thead><tr><th>Class Name</th><th>Stream</th><th>Students</th><th>Action</th></tr></thead><tbody>${teacherClasses.map(c => `<tr><td>${c.name}</td><td>${c.stream||'-'}</td><td>${c.studentCount||'-'}</td><td><button class="btn btn-sm btn-secondary" onclick="viewClassStudents(${c.id},'${c.name}')">View Students</button></td></tr>`).join('')}</tbody></table></div></div>`;
        }
        async function viewClassStudents(classId, className) {
            try {
                const students = await KalinabiriAPI.getStudents({ classId });
                const list = Array.isArray(students) ? students : students.students || [];
                openModal(`Students in ${className}`, `
                    <div class="table-wrapper"><table><thead><tr><th>Name</th><th>Email</th><th>Admission No.</th></tr></thead><tbody>
                    ${list.map(s => `<tr><td>${s.name||'-'}</td><td>${s.email||'-'}</td><td>${s.admissionNo||s.studentId||'-'}</td></tr>`).join('')}
                    </tbody></table></div>`, '<button class="btn btn-secondary" onclick="closeModal()">Close</button>');
            } catch(e) { showToast('Failed to load students', 'error'); }
        }

        // ===== ASSESSMENTS =====
        let assessmentsData = [];
        async function renderAssessments(container) {
            try {
                assessmentsData = await KalinabiriAPI.getAssessments() || [];
                if (!Array.isArray(assessmentsData)) assessmentsData = [];
            } catch(e) { assessmentsData = []; }
            const myAsses = assessmentsData.filter(a => !a.teacherId || a.teacherId === teacherData?.id);
            container.innerHTML = `
                <div class="card">
                    <div class="card-header"><h3 class="card-title">Assessments</h3><button class="btn btn-primary" onclick="openCreateAssessment()">+ Create Assessment</button></div>
                    <div class="table-wrapper">
                        <table>
                            <thead><tr><th>Title</th><th>Subject</th><th>Type</th><th>Due Date</th><th>Total Marks</th><th>Submissions</th><th>Status</th><th>Action</th></tr></thead>
                            <tbody>${myAsses.map(a => {
                                const ungraded = a.ungradedCount || 0;
                                return `<tr>
                                    <td>${a.title||'-'}</td>
                                    <td>${a.subject||'-'}</td>
                                    <td>${a.targetType||a.type||'-'}</td>
                                    <td>${a.dueDate ? new Date(a.dueDate).toLocaleDateString() : '-'}</td>
                                    <td>${a.totalMarks||'-'}</td>
                                    <td><span class="badge ${ungraded>0?'badge-warning':'badge-success'}">${a.submissionCount||0}${ungraded>0?' ('+ungraded+' ungraded)':''}</span></td>
                                    <td><span class="badge ${a.status==='open'||!a.status?'badge-success':'badge-warning'}">${a.status||'open'}</span></td>
                                    <td><button class="btn btn-sm btn-secondary" onclick="viewSubmissions('${a.id}','${a.title}')">View</button></td>
                                </tr>`;
                            }).join('')}</tbody>
                        </table>
                    </div>
                </div>`;
        }

        async function openCreateAssessment() {
            let subjects = [];
            try { subjects = await apiCall('/subjects') || []; } catch(e) {}
            if (!Array.isArray(subjects)) subjects = [];
            const studentOptions = allStudents.map(s => `<label class="student-item"><input type="checkbox" value="${s.id}" class="student-check"> ${s.name} <span class="text-muted">(${s.admissionNo||s.studentId||''})</span></label>`).join('');
            openModal('Create Assessment', `
                <form id="createAssessmentForm">
                    <div class="form-group"><label>Title</label><input type="text" id="assTitle" required></div>
                    <div class="form-group"><label>Description</label><textarea id="assDesc"></textarea></div>
                    <div class="form-group"><label>Subject</label><select id="assSubject" required>${subjects.map(s => `<option value="${s.id}">${s.name}</option>`).join('')}</select></div>
                    <div class="form-group">
                        <label>Target Type</label>
                        <select id="assTargetType" onchange="toggleAssessmentTarget()">
                            <option value="Individual">Individual Student</option>
                            <option value="Class">Entire Class</option>
                        </select>
                    </div>
                    <div class="form-group" id="classSelectGroup" style="display:none"><label>Select Class</label><select id="assClass">${teacherClasses.map(c => `<option value="${c.id}">${c.name}</option>`).join('')}</select></div>
                    <div class="form-group" id="studentSelectGroup"><label>Select Students</label><input type="text" class="student-search" placeholder="Search students..." oninput="filterStudents(this.value)"><div class="student-list" id="studentList">${studentOptions}</div></div>
                    <div class="form-row">
                        <div class="form-group"><label>Due Date</label><input type="date" id="assDueDate" required></div>
                        <div class="form-group"><label>Total Marks</label><input type="number" id="assTotalMarks" min="1" required></div>
                    </div>
                </form>`, '<button class="btn btn-secondary" onclick="closeModal()">Cancel</button><button class="btn btn-primary" onclick="submitAssessment()">Create</button>');
        }

        function toggleAssessmentTarget() {
            const type = $('#assTargetType').value;
            $('#classSelectGroup').style.display = type === 'Class' ? 'block' : 'none';
            $('#studentSelectGroup').style.display = type === 'Individual' ? 'block' : 'none';
        }

        function filterStudents(query) {
            query = query.toLowerCase();
            $$('.student-check').forEach(cb => {
                const item = cb.closest('.student-item');
                const name = cb.nextSibling.textContent.toLowerCase();
                item.style.display = name.includes(query) || !query ? '' : 'none';
            });
        }

        async function submitAssessment() {
            const title = $('#assTitle').value, desc = $('#assDesc').value, subject = $('#assSubject').value;
            const targetType = $('#assTargetType').value, dueDate = $('#assDueDate').value, totalMarks = $('#assTotalMarks').value;
            let targetIds = [];
            if (targetType === 'Individual') {
                targetIds = Array.from($$('.student-check:checked')).map(cb => cb.value);
                if (targetIds.length === 0) { showToast('Select at least one student', 'error'); return; }
            } else {
                const clsId = $('#assClass').value;
                const cls = teacherClasses.find(c => c.id == clsId);
                targetIds = cls ? [clsId] : [];
            }
            try {
                await KalinabiriAPI.createAssessment({ title, description: desc, subjectId: subject, targetType, targetIds, dueDate, totalMarks: parseInt(totalMarks) });
                showToast('Assessment created!', 'success');
                closeModal();
                loadPage('assessments');
            } catch(e) { showToast(e.message || 'Failed to create assessment', 'error'); }
        }

        async function viewSubmissions(assessmentId, title) {
            try {
                const subs = await KalinabiriAPI.getAssessmentSubmissions(assessmentId);
                const list = Array.isArray(subs) ? subs : [];
                openModal(`Submissions: ${title}`, `
                    <div class="table-wrapper"><table>
                        <thead><tr><th>Student</th><th>Status</th><th>Score</th><th>Grade</th><th>Remarks</th><th>Action</th></tr></thead>
                        <tbody>${list.map(s => `<tr>
                            <td>${s.studentName||s.student||'-'}</td>
                            <td><span class="badge ${s.status==='submitted'?'badge-success':'badge-warning'}">${s.status||'pending'}</span></td>
                            <td>${s.score!==null&&s.score!==undefined?s.score:'-'}</td>
                            <td>${s.grade||'-'}</td>
                            <td>${s.remarks||'-'}</td>
                            <td>${s.score===null||s.score===undefined?`<button class="btn btn-sm btn-primary" onclick="openGradeModal('${s.id}','${s.studentName||''}')">Grade</button>`:'<span class="text-muted">Graded</span>'}</td>
                        </tr>`).join('')}</tbody>
                    </table></div>`, '<button class="btn btn-secondary" onclick="closeModal()">Close</button>');
            } catch(e) { showToast('Failed to load submissions', 'error'); }
        }

        function openGradeModal(submissionId, studentName) {
            openModal(`Grade: ${studentName}`, `
                <form id="gradeForm">
                    <div class="form-row">
                        <div class="form-group"><label>Score</label><input type="number" id="gradeScore" min="0" required></div>
                        <div class="form-group"><label>Grade</label><input type="text" id="gradeLetter" maxlength="2" placeholder="A+" required></div>
                    </div>
                    <div class="form-group"><label>Remarks</label><textarea id="gradeRemarks" placeholder="Optional feedback..."></textarea></div>
                </form>`, `<button class="btn btn-secondary" onclick="closeModal()">Cancel</button><button class="btn btn-primary" onclick="submitGrade('${submissionId}')">Submit Grade</button>`);
        }

        async function submitGrade(submissionId) {
            const score = $('#gradeScore').value, grade = $('#gradeLetter').value, remarks = $('#gradeRemarks').value;
            try {
                await KalinabiriAPI.gradeSubmission(submissionId, { score: parseFloat(score), grade, remarks });
                showToast('Grade submitted!', 'success');
                closeModal();
            } catch(e) { showToast(e.message || 'Failed to submit grade', 'error'); }
        }

        // ===== ATTENDANCE =====
        async function renderAttendance(container) {
            container.innerHTML = `
                <div class="card">
                    <div class="card-header"><h3 class="card-title">Take Attendance</h3></div>
                    <div class="form-row mb-4">
                        <div class="form-group">
                            <label>Class</label>
                            <select id="attClass" onchange="loadAttendanceStudents()">${teacherClasses.map(c => `<option value="${c.id}">${c.name}</option>`).join('')}</select>
                        </div>
                        <div class="form-group">
                            <label>Date</label>
                            <input type="date" id="attDate" value="${new Date().toISOString().split('T')[0]}">
                        </div>
                    </div>
                    <div id="attendanceContent"><p class="text-muted">Select a class to view students</p></div>
                </div>`;
            loadAttendanceStudents();
        }

        async function loadAttendanceStudents() {
            const classId = $('#attClass')?.value;
            const date = $('#attDate')?.value;
            if (!classId || !date) return;
            const content = $('#attendanceContent');
            content.innerHTML = '<div class="loading-overlay"><div class="spinner"></div></div>';
            try {
                const students = await KalinabiriAPI.getStudents({ classId });
                const list = Array.isArray(students) ? students : students.students || [];
                let existingAtt = {};
                try { existingAtt = await KalinabiriAPI.getAttendance({ classId, date }) || {}; } catch(e) {}
                if (Array.isArray(existingAtt)) existingAtt = {};
                content.innerHTML = `<div class="table-wrapper"><table><thead><tr><th>Student</th><th>Admission No.</th><th>Mark Attendance</th></tr></thead><tbody>
                    ${list.map(s => {
                        const status = existingAtt[s.id]?.status || '';
                        return `<tr>
                            <td>${s.name||'-'}</td>
                            <td>${s.admissionNo||s.studentId||'-'}</td>
                            <td><div class="attendance-grid">
                                <button class="attendance-btn ${status==='present'?'present':''}" onclick="setAttendance('${s.id}','present',this)">Present</button>
                                <button class="attendance-btn ${status==='absent'?'absent':''}" onclick="setAttendance('${s.id}','absent',this)">Absent</button>
                                <button class="attendance-btn ${status==='late'?'late':''}" onclick="setAttendance('${s.id}','late',this)">Late</button>
                            </div></td>
                        </tr>`;
                    }).join('')}</tbody></table></div>
                    <button class="btn btn-primary mt-4" onclick="saveAttendance()">Save Attendance</button>`;
            } catch(e) { content.innerHTML = '<p class="text-muted">Failed to load students</p>'; }

        let attendanceState = {};
        function setAttendance(studentId, status, btn) {
            attendanceState[studentId] = status;
            const row = btn.closest('tr');
            row.querySelectorAll('.attendance-btn').forEach(b => { b.classList.remove('present','absent','late'); });
            btn.classList.add(status);
        }

        async function saveAttendance() {
            const classId = $('#attClass').value, date = $('#attDate').value;
            const records = Object.entries(attendanceState).map(([studentId, status]) => ({ studentId, status, classId, date }));
            if (records.length === 0) { showToast('No attendance marked', 'warning'); return; }
            try {
                await apiCall('/attendance', { method: 'POST', body: JSON.stringify({ records }) });
                showToast('Attendance saved!', 'success');
                attendanceState = {};
                loadAttendanceStudents();
            } catch(e) { showToast(e.message || 'Failed to save', 'error'); }
        }

        // ===== RESULTS =====
        async function renderResults(container) {
            let terms = [];
            try { terms = await apiCall('/terms') || []; } catch(e) {}
            if (!Array.isArray(terms)) terms = [];
            container.innerHTML = `
                <div class="card">
                    <div class="card-header"><h3 class="card-title">Student Results</h3><button class="btn btn-primary" onclick="openAddResult()">+ Add Result</button></div>
                    <div class="form-row mb-4">
                        <div class="form-group">
                            <label>Class</label>
                            <select id="resClass" onchange="loadResults()">${teacherClasses.map(c => `<option value="${c.id}">${c.name}</option>`).join('')}</select>

                            <label>Term</label>

                    </div>
                    <div id="resultsContent"><p class="text-muted">Select class and term</p></div>
                </div>`;
            if (terms.length > 0) loadResults();

        async function loadResults() {
            const classId = $('#resClass')?.value, termId = $('#resTerm')?.value;
            if (!classId || !termId) return;
            const content = $('#resultsContent');
            content.innerHTML = '<div class="loading-overlay"><div class="spinner"></div></div>';
            try {
                const results = await KalinabiriAPI.getResults({ classId, termId }) || [];
                const list = Array.isArray(results) ? results : results.results || [];
                content.innerHTML = `<div class="table-wrapper"><table><thead><tr><th>Student</th><th>Subject</th><th>Score</th><th>Grade</th><th>Remarks</th></tr></thead><tbody>
                    ${list.map(r => `<tr><td>${r.studentName||'-'}</td><td>${r.subject||'-'}</td><td>${r.score!==undefined?r.score:'-'}</td><td>${r.grade||'-'}</td><td>${r.remarks||'-'}</td></tr>`).join('')}
                    ${list.length === 0 ? '<tr><td colspan="5" class="text-center text-muted">No results found</td></tr>' : ''}
                </tbody></table></div>`;
            } catch(e) { content.innerHTML = '<p class="text-muted">Failed to load results</p>'; }
        }

        async function openAddResult() {
            let subjects = [], students = [], terms = [];
            try { [subjects, students, terms] = await Promise.all([KalinabiriAPI.getSubjects(), allStudents.length ? allStudents : KalinabiriAPI.getStudents({ classId: teacherClasses[0]?.id }), KalinabiriAPI.getTerms()]); } catch(e) {}
            if (!Array.isArray(subjects)) subjects = [];
            if (!Array.isArray(students)) students = [];
            if (!Array.isArray(terms)) terms = [];
            const studentOpts = students.map(s => `<option value="${s.id}">${s.name}</option>`).join('');
            const termOpts = terms.map(t => `<option value="${t.id}">${t.name}</option>`).join('');
            const subjectOpts = subjects.map(s => `<option value="${s.id}">${s.name}</option>`).join('');
            openModal('Add Result', `
                <form id="resultForm">
                    <div class="form-group"><label>Class</label><select id="resClassAdd" onchange="loadStudentsForResult()">${teacherClasses.map(c => `<option value="${c.id}">${c.name}</option>`).join('')}</select></div>
                    <div class="form-row">
                        <div class="form-group"><label>Student</label><select id="resStudent" required>${studentOpts}</select></div>
                        <div class="form-group"><label>Term</label><select id="resTermAdd">${termOpts}</select></div>
                    </div>
                    <div class="form-group"><label>Subject</label><select id="resSubject">${subjectOpts}</select></div>
                    <div class="form-row">
                        <div class="form-group"><label>Score</label><input type="number" id="resScore" min="0" max="100" required></div>
                        <div class="form-group"><label>Grade</label><input type="text" id="resGrade" maxlength="2" placeholder="A" required></div>
                    </div>
                    <div class="form-group"><label>Remarks</label><textarea id="resRemarks"></textarea></div>
                </form>`, '<button class="btn btn-secondary" onclick="closeModal()">Cancel</button><button class="btn btn-primary" onclick="submitResult()">Save Result</button>');

        async function loadStudentsForResult() {
            const classId = $('#resClassAdd').value;
            try {
                const students = await KalinabiriAPI.getStudents({ classId });
                const list = Array.isArray(students) ? students : students.students || [];
                $('#resStudent').innerHTML = list.map(s => `<option value="${s.id}">${s.name}</option>`).join('');
            } catch(e) {}
        }

        async function submitResult() {
            const studentId = $('#resStudent').value, termId = $('#resTermAdd').value, subjectId = $('#resSubject').value;
            const score = $('#resScore').value, grade = $('#resGrade').value, remarks = $('#resRemarks').value;
            if (!studentId || !score || !grade) { showToast('Fill required fields', 'error'); return; }
            try {
                await KalinabiriAPI.post('/results', { studentId, termId, subjectId, score: parseFloat(score), grade, remarks });
                showToast('Result added!', 'success');
                closeModal();
                loadResults();
            } catch(e) { showToast(e.message || 'Failed to add result', 'error'); }
        }

        // ===== ANNOUNCEMENTS =====
        async function renderAnnouncements(container) {
                    let announcements = [];
                    try { announcements = await KalinabiriAPI.getAnnouncements() || []; } catch(e) {}
                    if (!Array.isArray(announcements)) announcements = [];
                    container.innerHTML = `
